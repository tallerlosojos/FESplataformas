<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FESplataformas - América Latina</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Foundation CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css"
        crossorigin="anonymous" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="margin-bottom-2">
        <div class="grid-container" equalizer>
            <div class="grid-x grid-padding-x">
                <div class="cell medium-5" equalizer-watch>
                    <h1 class="h2">FESplataformas</h1>
                    <p class="subheader">Sindicatos tradicionales y trabajadores de plataformas en América Latina</p>
                </div>
                <div class="cell medium-2 medium-offset-2" equalizer-watch>
                    <a class="button" href="index.html">volver al mapa</a>
                </div>
                <div class="cell medium-3" equalizer-watch>
                    <div class="callout primary">
                        <h5><i class="fas fa-chart-line"></i> Repositorio</h5>
                        <p id="total-countries">Cargando datos...</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="grid-container">
        <section class="callout margin-bottom-2">
            <h4><i class="fas fa-filter"></i> Filtros de Búsqueda</h4>
            <div class="grid-x grid-margin-x">
                <div class="cell medium-4">
                    <label for="zone-filter"><i class="fas fa-globe-americas"></i> Zona Geográfica</label>
                    <select id="zone-filter" class="filter-select">
                        <option value="all">Todas las zonas</option>
                    </select>
                </div>
                <div class="cell medium-4">
                    <label for="central-filter"><i class="fas fa-users"></i> Centrales por país</label>
                    <select id="central-filter" class="filter-select">
                        <option value="all">Cualquier número de centrales</option>
                        <option value="1">1 central</option>
                        <option value="2">2 centrales</option>
                        <option value="3">3 centrales</option>
                        <option value="4">4 o más centrales</option>
                    </select>
                </div>
                <div class="cell medium-4">
                    <label for="sort-filter"><i class="fas fa-sort-amount-down"></i> Ordenar por</label>
                    <select id="sort-filter" class="filter-select">
                        <option value="name-asc">Nombre (A-Z)</option>
                        <option value="name-desc">Nombre (Z-A)</option>
                        <option value="centrales-desc">Más centrales primero</option>
                        <option value="centrales-asc">Menos centrales primero</option>
                    </select>
                </div>
            </div>
            <div class="grid-x grid-margin-x margin-top-1">
                <div class="cell text-right">
                    <button id="reset-filters" class="button secondary">
                        <i class="fas fa-redo"></i> Restablecer filtros
                    </button>
                </div>
            </div>
        </section>

        <section>
            <h2 class="hide">Países <span id="results-count"></span></h2>
            <div class="grid-x grid-margin-x" id="countries-container">
                <!-- Las tarjetas de países se generarán con JavaScript -->
            </div>
        </section>

        <section class="callout margin-bottom-2">
            <h4>Estadísticas</h4>
            <div class="grid-x grid-margin-x" id="zone-stats">
                <!-- Las estadísticas por zona se generarán con JavaScript -->
            </div>
        </section>
    </div>

    <footer class="margin-top-3">
        <div class="grid-container">
            <p>Plataforma de información sindical &copy; <span id="current-year"></span></p>
            <p class="small">Datos geoespaciales de centrales sindicales en América Latina y el Caribe</p>
        </div>
    </footer>

    <!-- Foundation JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/js/foundation.min.js"
        crossorigin="anonymous"></script>

    <script>
        // Inicializar Foundation
        $(document).foundation();

        // Cargar los datos del archivo externo
        let countriesData = [];
        let zones = new Set();

        // Cargar datos desde el archivo externo
        console.log("Intentando cargar datos desde: ./data/FESplataformas_0.js");
        fetch('./data/FESplataformas_0.js')
            .then(response => {
                console.log("Respuesta recibida, status:", response.status);
                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
                }
                return response.text();
            })
            .then(data => {
                console.log("Archivo cargado exitosamente. Longitud:", data.length, "caracteres");

                // Extraer el objeto JSON del archivo JS con un regex más robusto
                const jsonMatch = data.match(/var json_FESplataformas_0 = (\{[\s\S]*?\});/);

                if (jsonMatch && jsonMatch[1]) {
                    console.log("✅ JSON encontrado en el archivo");

                    // Limpiar el JSON antes de parsear
                    let jsonString = jsonMatch[1];

                    // 1. Reemplazar comillas curvadas por comillas rectas (problema común de copy-paste)
                    jsonString = jsonString.replace(/[“”]/g, '"');

                    // 2. Escapar caracteres especiales en strings
                    jsonString = jsonString.replace(/\n/g, '\\n')
                        .replace(/\r/g, '\\r')
                        .replace(/\t/g, '\\t');

                    // 3. Asegurar que los strings estén correctamente formados
                    jsonString = jsonString.replace(/(\w+):\s*"([^"]*)"/g, function (match, key, value) {
                        const escapedValue = value.replace(/\\/g, '\\\\')
                            .replace(/"/g, '\\"')
                            .replace(/\n/g, '\\n')
                            .replace(/\r/g, '\\r')
                            .replace(/\t/g, '\\t');
                        return key + ': "' + escapedValue + '"';
                    });

                    console.log("JSON limpiado, primeros 500 chars:", jsonString.substring(0, 500));

                    try {
                        const jsonData = JSON.parse(jsonString);
                        console.log("✅ JSON parseado correctamente");
                        console.log("Número de países (features):", jsonData.features.length);

                        // Procesar los datos
                        processData(jsonData.features);
                        initializePage();
                    } catch (parseError) {
                        console.error('❌ Error al parsear JSON después de limpiar:', parseError);

                        // Intentar un enfoque alternativo: evaluar como JavaScript
                        console.log("Intentando evaluación como JavaScript...");
                        try {
                            const jsonData = eval('(' + jsonMatch[1] + ')');
                            console.log("✅ JSON evaluado como JavaScript exitosamente");
                            processData(jsonData.features);
                            initializePage();
                        } catch (evalError) {
                            console.error('❌ Error al evaluar como JS:', evalError);
                            showError('No se pudo procesar el archivo de datos. El formato contiene caracteres inválidos.');
                        }
                    }
                } else {
                    console.error('❌ No se pudo extraer JSON del archivo');
                    showError('Formato de archivo incorrecto. El archivo debe contener "var json_FESplataformas_0 = {...};"');
                }
            })
            .catch(error => {
                console.error('❌ Error al cargar el archivo:', error);
                showError(`Error al cargar el archivo de datos: ${error.message}`);
            });

        // Función para mostrar errores en la página
        function showError(message) {
            document.getElementById('countries-container').innerHTML = `
                <div class="cell">
                    <div class="callout alert text-center">
                        <h4><i class="fas fa-exclamation-triangle"></i> Error al cargar datos</h4>
                        <p>${message}</p>
                        <p class="small">
                            <strong>Solución alternativa:</strong><br>
                            1. Abre el archivo FESplataformas_0.js en un editor de texto<br>
                            2. Guarda como UTF-8 sin BOM<br>
                            3. Reemplaza todas las comillas curvadas por rectas<br>
                        </p>
                    </div>
                </div>
            `;
            document.getElementById('total-countries').innerHTML = `<strong>Error</strong>`;
        }

        function processData(features) {
            console.log("Procesando", features.length, "países...");

            countriesData = features.map((feature, index) => {
                const props = feature.properties;

                // Contar centrales no nulas
                const centralesCount = [
                    props.CENTRAL1,
                    props.CENTRAL2,
                    props.CENTRAL3,
                    props.CENTRAL4,
                    props.CENTRAL5,
                    props.CENTRAL6,
                    props.CENTRAL7
                ].filter(central => central && central.trim() !== '').length;

                // Obtener lista de centrales
                const centralesList = [
                    props.CENTRAL1,
                    props.CENTRAL2,
                    props.CENTRAL3,
                    props.CENTRAL4,
                    props.CENTRAL5,
                    props.CENTRAL6,
                    props.CENTRAL7
                ].filter(central => central && central.trim() !== '');

                // Añadir zona al conjunto de zonas únicas
                if (props.ZONA) {
                    zones.add(props.ZONA);
                } else {
                    console.warn(`País ${props.COUNTRY} no tiene ZONA definida`);
                }

                const countryData = {
                    id: props.COUNTRY ? props.COUNTRY.toLowerCase().replace(/\s+/g, '-') : `pais-${index}`,
                    name: props.COUNTRY || `País ${index + 1}`,
                    zone: props.ZONA || 'Sin zona',
                    description: props.DESCRIPCION || '',
                    centralesCount: centralesCount,
                    centralesList: centralesList,
                    entrevistas: props.ENTREVISTAS || '',
                    legislacion: props.LEGISLACION || '',
                    otros: props.OTROS || '',
                    urlpais: props.URLPAIS || '',
                    allProperties: props
                };

                console.log(`Procesado: ${countryData.name} (${centralesCount} centrales)`);
                return countryData;
            });

            console.log("Procesamiento completado. Total países:", countriesData.length);
            console.log("Zonas encontradas:", Array.from(zones));
        }

        function initializePage() {
            console.log("Inicializando página...");

            // Establecer el año actual en el footer
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Actualizar contador total de países
            document.getElementById('total-countries').innerHTML = `
                <strong>${countriesData.length}</strong> países archivados
                
            `;

            // Llenar opciones de filtro de zona
            const zoneFilter = document.getElementById('zone-filter');
            zones.forEach(zone => {
                const option = document.createElement('option');
                option.value = zone;
                option.textContent = zone;
                zoneFilter.appendChild(option);
            });

            console.log("Filtros de zona creados:", zones.size, "zonas");

            // Generar estadísticas por zona
            generateZoneStats();

            // Mostrar todos los países inicialmente
            renderCountries(countriesData);

            // Añadir event listeners a los filtros
            document.getElementById('zone-filter').addEventListener('change', applyFilters);
            document.getElementById('central-filter').addEventListener('change', applyFilters);
            document.getElementById('sort-filter').addEventListener('change', applyFilters);
            document.getElementById('reset-filters').addEventListener('click', resetFilters);

            console.log("Página inicializada correctamente");
        }

        function generateZoneStats() {
            const zoneStatsContainer = document.getElementById('zone-stats');
            const statsByZone = {};

            // Calcular estadísticas por zona
            countriesData.forEach(country => {
                if (!statsByZone[country.zone]) {
                    statsByZone[country.zone] = {
                        count: 0,
                        totalCentrales: 0
                    };
                }

                statsByZone[country.zone].count++;
                statsByZone[country.zone].totalCentrales += country.centralesCount;
            });

            // Generar HTML de estadísticas
            let statsHTML = '';
            Object.keys(statsByZone).forEach(zone => {
                const avgCentrales = (statsByZone[zone].totalCentrales / statsByZone[zone].count).toFixed(1);

                statsHTML += `
                    <div class="cell medium-4">
                        <div class="callout text-center">
                            <h3 class="stat-value">${statsByZone[zone].count}</h3>
                            <p class="stat-label">Países en</p>
                            <p class="stat-zone"><strong>${zone}</strong></p>
                            <p class="small">
                                <i class="fas fa-users"></i> ${avgCentrales} centrales/promedio
                            </p>
                        </div>
                    </div>
                `;
            });

            zoneStatsContainer.innerHTML = statsHTML;
        }

        function applyFilters() {
            const selectedZone = document.getElementById('zone-filter').value;
            const selectedCentralFilter = document.getElementById('central-filter').value;
            const sortOption = document.getElementById('sort-filter').value;

            // Filtrar países
            let filteredCountries = countriesData.filter(country => {
                // Filtrar por zona
                if (selectedZone !== 'all' && country.zone !== selectedZone) {
                    return false;
                }

                // Filtrar por número de centrales
                if (selectedCentralFilter !== 'all') {
                    const centralFilterValue = parseInt(selectedCentralFilter);

                    if (centralFilterValue === 4) {
                        // 4 o más centrales
                        if (country.centralesCount < 4) return false;
                    } else {
                        // Número exacto de centrales
                        if (country.centralesCount !== centralFilterValue) return false;
                    }
                }

                return true;
            });

            // Ordenar países
            filteredCountries.sort((a, b) => {
                switch (sortOption) {
                    case 'name-asc':
                        return a.name.localeCompare(b.name);
                    case 'name-desc':
                        return b.name.localeCompare(a.name);
                    case 'centrales-desc':
                        return b.centralesCount - a.centralesCount;
                    case 'centrales-asc':
                        return a.centralesCount - b.centralesCount;
                    default:
                        return 0;
                }
            });

            // Mostrar resultados
            renderCountries(filteredCountries);
        }

        function renderCountries(countries) {
            const container = document.getElementById('countries-container');
            const resultsCount = document.getElementById('results-count');

            // Actualizar contador de resultados
            if (countries.length === 0) {
                resultsCount.innerHTML = '<span style="color: #666; font-weight: normal;">(0 países)</span>';
                container.innerHTML = `
                    <div class="cell">
                        <div class="callout warning text-center">
                            <h4><i class="fas fa-search"></i> No se encontraron países</h4>
                            <p>Intenta ajustar los filtros de búsqueda.</p>
                        </div>
                    </div>
                `;
                return;
            }

            resultsCount.innerHTML = `<span style="color: #666; font-weight: normal;">(${countries.length} países)</span>`;

            // Generar tarjetas de países
            let countriesHTML = '';

            countries.forEach(country => {
                // Generar lista de centrales
                let centralesHTML = '';
                country.centralesList.forEach((central, index) => {
                    if (index < 3) {
                        centralesHTML += `<li>${central}</li>`;
                    }
                });

                // Si hay más de 3 centrales, añadir indicador
                if (country.centralesList.length > 3) {
                    centralesHTML += `<li class="small"><em>+${country.centralesList.length - 3} más</em></li>`;
                }

                // Si no hay centrales
                if (country.centralesList.length === 0) {
                    centralesHTML = '<li class="small"><em>No se registran centrales</em></li>';
                }

                countriesHTML += `
                    <div class="cell medium-6 large-4">
                        <div class="card"  data-equalizer="pais">
                            <div class="card-divider" style="padding: 0 0 0 1rem;">
                                <div class="grid-x align-middle" style="width: 100%;">
                                    <div class="cell small-6">
                                <h5 style="font-size: 1rem;
    padding: 0.5rem 0;
    font-weight: bold;margin: 0;">${country.name}</h5>
                                </div>
                                <div class="cell small-6">
                                <span class="label float-right" style="padding: .7rem .75rem;">${country.zone}</span>
                                </div>
                                </div>
                                
                            </div>
                            <div class="card-section"  style="min-height: 250px;">
                                <p>
                                    <i class="fas fa-users"></i>
                                    <strong>${country.centralesCount}</strong> centrales sindicales registradas
                                </p>
                                <ul class="no-bullet">
                                    ${centralesHTML}
                                </ul>
                            </div>
                            <div class="card-section">
                                <div class="button-group expanded">
                                    <a href="viewer.html?country=${country.id}" class="button">
                                        <i class="fas fa-external-link-alt"></i> Ver más
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = countriesHTML;
        }

        function resetFilters() {
            document.getElementById('zone-filter').value = 'all';
            document.getElementById('central-filter').value = 'all';
            document.getElementById('sort-filter').value = 'name-asc';
            applyFilters();
        }
    </script>
</body>

</html>
