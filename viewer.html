<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del País - Plataformas Sindicales</title>
    
    <!-- jQuery (requerido por Foundation) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    
    <!-- Foundation CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css" crossorigin="anonymous" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-viewer">
    <header class="viewer-header margin-bottom-2">
        <div class="grid-container">
            <div class="grid-x grid-padding-x align-middle">
                <div class="cell auto">
                    <h1 class="h3">Plataformas Sindicales</h1>
                    <!-- <p class="subheader">Detalles del país</p> -->
                </div>
                <div class="cell shrink">
                    <a href="paises.html" class="button">
                        <i class="fas fa-arrow-left"></i> Volver al repositorio
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="grid-container">
        <div id="country-container">
            <div class="callout text-center">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: #1779ba; margin-bottom: 1rem;"></i>
                <h3>Cargando información del país...</h3>
            </div>
        </div>

        <footer class="margin-top-3">
            <p>Plataforma de información sindical &copy; <span id="current-year"></span></p>
        </footer>
    </div>

    <!-- Foundation JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/js/foundation.min.js" crossorigin="anonymous"></script>
    
    <script>
        // Inicializar Foundation
        $(document).foundation();
        
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const countryId = urlParams.get('country');
        
        // Establecer el año actual en el footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Cargar datos del país
        if (countryId) {
            loadCountryData(countryId);
        } else {
            showError('No se especificó un país para mostrar');
        }
        
                function loadCountryData(countryId) {
            console.log("Cargando datos para país ID:", countryId);
            
            fetch('./data/FESplataformas_0.js')
                .then(response => {
                    if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
                    return response.text();
                })
                .then(data => {
                    // Extracción robusta del objeto JS
                    const jsonMatch = data.match(/var json_FESplataformas_0 = (\{[\s\S]*?\});/);
                    
                    if (jsonMatch && jsonMatch[1]) {
                        try {
                            // Usamos new Function para procesar el objeto JS de forma segura y directa
                            const jsonData = new Function(`return ${jsonMatch[1]}`)();
                            
                            const countryFeature = jsonData.features.find(feature => {
                                const name = feature.properties.COUNTRY;
                                return name && name.toLowerCase().replace(/\s+/g, '-') === countryId;
                            });
                            
                            countryFeature ? displayCountry(countryFeature) : showError('País no encontrado');
                        } catch (e) {
                            console.error('Error procesando datos:', e);
                            showError('Error al procesar la base de datos');
                        }
                    }
                })
                .catch(error => showError('Error al cargar archivo: ' + error.message));
        }
        
        function displayCountry(feature) {
            const props = feature.properties;
            
            // 1. Filtrar centrales y capturar sus nuevas reseñas (resena1, resena2...)
            const centrales = [];
            for (let i = 1; i <= 7; i++) {
                const nombre = props[`CENTRAL${i}`];
                const resena = props[`resena${i}`]; // El campo que añadiste
                if (nombre && nombre.trim() !== '') {
                    centrales.push({ num: i, name: nombre, text: resena });
                }
            }
            
            const centralesCount = centrales.length;
            
            // 2. Generar HTML de las tarjetas de centrales
            let centralesHTML = '';
            if (centrales.length > 0) {
                centrales.forEach(c => {
                    centralesHTML += `
                        <div class="viewer-central-item cell medium-6 large-4 margin-bottom-1">
                            <div class="callout" style="height: 100%; border-left: 5px solid #1779ba;">
                                <span class="label alert">${c.num}</span>
                                <h5 class="viewer-central-name"><strong>${c.name}</strong></h5>
                                <hr>
                                <p class="small" style="line-height: 1.4;">${c.text || '<em>Sin reseña disponible.</em>'}</p>
                            </div>
                        </div>`;
                });
            } else {
                centralesHTML = `<div class="cell"><div class="callout warning">No se registran centrales.</div></div>`;
            }
            
            let descripcionHTML = props.DESCRIPCION || '<p>No hay descripción disponible</p>';
            
            // 3. Tu estructura original de visualización
            const countryHTML = `
                <div class="viewer-head-content grid-x align-middle margin-bottom-2">
                    <div class="cell medium-8">
                        <h2 class="viewer-pais-title">${props.COUNTRY || 'Sin nombre'}</h2>
                    </div>
                    <div class="cell medium-4 text-right">
                        <span class="label rounded">Zona ${props.ZONA || 'N/A'}</span>
                        <span class="label success rounded"><i class="fas fa-users"></i> ${centralesCount} centrales</span>
                    </div>
                </div>
                
                <div class="viewer-description margin-bottom-2">
                    <div class="callout">
                        <h5><i class="fas fa-info-circle"></i> Descripción</h5>
                        ${descripcionHTML}
                    </div>
                </div>
                
                
                <div class="margin-bottom-2">
                    <h5><i class="fas fa-users"></i> Centrales Sindicales</h5>
                    <div class="grid-x grid-margin-x">
                        ${centralesHTML}
                    </div>
                </div>
                
                <div class="margin-bottom-2">
                    <h5><i class="fas fa-link"></i> Recursos Adicionales</h5>
                    <div class="grid-x grid-margin-x">
                        <div class="cell medium-4">
                            <div class="callout"><h6>Entrevistas</h6><p>${props.ENTREVISTAS || 'No disponible'}</p></div>
                        </div>
                        <div class="cell medium-4">
                            <div class="callout"><h6>Legislación</h6><p>${props.LEGISLACION || 'No disponible'}</p></div>
                        </div>
                        <div class="cell medium-4">
                            <div class="callout"><h6>Otros</h6><p>${props.OTROS || 'No disponible'}</p></div>
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <a href="paises.html" class="button secondary"><i class="fas fa-arrow-left"></i> Volver al listado</a>
                </div>
            `;
            
            document.getElementById('country-container').innerHTML = countryHTML;
        }

        
                function displayCountry(feature) {
            const props = feature.properties;
            console.log("Mostrando país:", props.COUNTRY);
            
            // Obtener lista de centrales
            const centrales = [
                {num: 1, name: props.CENTRAL1},
                {num: 2, name: props.CENTRAL2},
                {num: 3, name: props.CENTRAL3},
                {num: 4, name: props.CENTRAL4},
                {num: 5, name: props.CENTRAL5},
                {num: 6, name: props.CENTRAL6},
                {num: 7, name: props.CENTRAL7}
            ].filter(central => central.name && central.name.trim() !== '');
            
            // Contar centrales
            const centralesCount = centrales.length;
            
            // Generar HTML para las centrales (Integrando el campo resena)
            let centralesHTML = '';
            if (centrales.length > 0) {
                centrales.forEach(central => {
                    // Capturar la reseña correspondiente (resena1, resena2, etc.)
                    const resenaTexto = props[`RESENA${central.num}`] || 'No hay reseña disponible';
                    
                    centralesHTML += `
                        <div class="viewer-central-item cell medium-4 margin-bottom-1">
                            <div class="callout" style="height: 100%;">
                                <span class="label alert">${central.num}</span>
                                <h5 class="viewer-central-name"><strong>${central.name}</strong></h5>
                                <hr>
                                <p class="central-desc small text-left">${resenaTexto}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                centralesHTML = `
                    <div class="cell">
                        <div class="callout warning text-center">
                            <i class="fas fa-users fa-2x" style="margin-bottom: 1rem;"></i>
                            <h4>No se registran centrales sindicales</h4>
                        </div>
                    </div>
                `;
            }
            
            // Procesar la descripción HTML (si existe)
            let descripcionHTML = props.DESCRIPCION || '<p class="text-muted"><em>No hay descripción disponible</em></p>';
            
            // Crear HTML del país (Tu estructura original completa)
            const countryHTML = `
                    <div class="viewer-head-content grid-x align-middle margin-bottom-2">
                        <div class="cell medium-8">
                            <h2 class="viewer-pais-title">${props.COUNTRY || 'País sin nombre'}</h2>
                        </div>
                        <div class="cell medium-4 text-right">
                            <span class="label rounded">Zona ${props.ZONA || 'Sin zona'}</span>
                            <span class="label success rounded">
                                <i class="fas fa-users"></i> ${centralesCount} centrales sindicales
                            </span>
                        </div>
                    </div>
                    
                    <div class="viewer-description">
                        <div class="callout">
                            <h5><i class="fas fa-info-circle"></i> Descripción</h5>
                            ${descripcionHTML}
                        </div>
                    </div>

                    <hr/>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-users"></i> Centrales Sindicales</h5>
                        <div class="grid-x grid-margin-x">
                            ${centralesHTML}
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-link"></i> Recursos Adicionales</h5>
                        <div class="grid-x grid-margin-x">
                            <div class="cell medium-6">
                                <div class="callout">
                                    <h6><i class="fas fa-gavel"></i> Legislación asociada</h6>
                                    <p>${props.LEGISLACION || 'No disponible'}</p>
                                </div>
                            </div>
                            <div class="cell medium-6">
                                <div class="callout">
                                    <h6><i class="fas fa-info"></i> Más información</h6>
                                    <p>${props.OTROS || 'No disponible'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-external-link-alt"></i> Acciones</h5>
                        <div class="button-group">
                            <a href="paises.html" class="button"><i class="fas fa-arrow-left"></i> volver al repositorio</a>
                            <a href="index.html" class="button secondary">
                                 ir al mapa
                            </a>
                        </div>
                    </div>
            `;
            
            // Mostrar en la página
            document.getElementById('country-container').innerHTML = countryHTML;
            $(document).foundation(); // Asegura que Foundation reconozca el nuevo HTML
        }

        
        function showError(message) {
            document.getElementById('country-container').innerHTML = `
                <div class="callout alert text-center">
                    <h4><i class="fas fa-exclamation-triangle"></i> ${message}</h4>
                    <p style="margin-top: 1rem;">
                        <a href="paises.html" class="button">
                            <i class="fas fa-arrow-left"></i> Volver al repositorio
                        </a>
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
