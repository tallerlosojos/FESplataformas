<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del País - Plataformas Sindicales</title>
    
    <!-- jQuery (requerido por Foundation) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Foundation CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css" crossorigin="anonymous" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
    </style>
</head>
<body>
    <header class="margin-bottom-2">
        <div class="grid-container">
            <div class="grid-x grid-padding-x align-middle">
                <div class="cell auto">
                    <h1 class="h3">Plataformas Sindicales</h1>
                    <p class="subheader">Detalles del país</p>
                </div>
                <div class="cell shrink">
                    <a href="paises.html" class="button secondary">
                        <i class="fas fa-arrow-left"></i> Volver al listado
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="grid-container">
        <div id="country-container">
            <div class="callout text-center">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: #1779ba; margin-bottom: 1rem;"></i>
                <h3>Cargando información del país...</h3>
            </div>
        </div>

        <footer class="margin-top-3">
            <p>Plataforma de información sindical &copy; <span id="current-year"></span></p>
        </footer>
    </div>

    <!-- Foundation JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/js/foundation.min.js" crossorigin="anonymous"></script>
    
    <script>
        // Inicializar Foundation
        $(document).foundation();
        
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const countryId = urlParams.get('country');
        
        // Establecer el año actual en el footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Cargar datos del país
        if (countryId) {
            loadCountryData(countryId);
        } else {
            showError('No se especificó un país para mostrar');
        }
        
        function loadCountryData(countryId) {
            console.log("Cargando datos para país ID:", countryId);
            
            // Cargar datos desde el archivo externo
            fetch('./data/FESplataformas_0.js')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(data => {
                    console.log("Archivo de datos cargado");
                    
                    // Extraer el objeto JSON del archivo JS
                    const jsonMatch = data.match(/var json_FESplataformas_0 = (\{[\s\S]*?\});/);
                    
                    if (jsonMatch && jsonMatch[1]) {
                        // Limpiar el JSON antes de parsear (igual que en paises.html)
                        let jsonString = jsonMatch[1];
                        
                        // 1. Reemplazar comillas curvadas por comillas rectas
                        jsonString = jsonString.replace(/["'']/g, '"');
                        
                        // 2. Escapar caracteres especiales en strings
                        jsonString = jsonString.replace(/\n/g, '\\n')
                                               .replace(/\r/g, '\\r')
                                               .replace(/\t/g, '\\t');
                        
                        // 3. Asegurar que los strings estén correctamente formados
                        jsonString = jsonString.replace(/(\w+):\s*"([^"]*)"/g, function(match, key, value) {
                            const escapedValue = value.replace(/\\/g, '\\\\')
                                                      .replace(/"/g, '\\"')
                                                      .replace(/\n/g, '\\n')
                                                      .replace(/\r/g, '\\r')
                                                      .replace(/\t/g, '\\t');
                            return key + ': "' + escapedValue + '"';
                        });
                        
                        try {
                            const jsonData = JSON.parse(jsonString);
                            console.log("JSON parseado correctamente");
                            
                            // Buscar el país por ID
                            const countryFeature = jsonData.features.find(feature => {
                                const countryName = feature.properties.COUNTRY;
                                if (!countryName) return false;
                                const normalizedId = countryName.toLowerCase().replace(/\s+/g, '-');
                                return normalizedId === countryId;
                            });
                            
                            if (countryFeature) {
                                console.log("País encontrado:", countryFeature.properties.COUNTRY);
                                displayCountry(countryFeature);
                            } else {
                                console.error("País no encontrado con ID:", countryId);
                                showError('País no encontrado');
                            }
                        } catch (parseError) {
                            console.error('Error al parsear JSON:', parseError);
                            
                            // Intentar evaluación como JavaScript
                            try {
                                const jsonData = eval('(' + jsonMatch[1] + ')');
                                console.log("JSON evaluado como JavaScript");
                                
                                // Buscar el país por ID
                                const countryFeature = jsonData.features.find(feature => {
                                    const countryName = feature.properties.COUNTRY;
                                    if (!countryName) return false;
                                    const normalizedId = countryName.toLowerCase().replace(/\s+/g, '-');
                                    return normalizedId === countryId;
                                });
                                
                                if (countryFeature) {
                                    displayCountry(countryFeature);
                                } else {
                                    showError('País no encontrado');
                                }
                            } catch (evalError) {
                                console.error('Error al evaluar como JS:', evalError);
                                showError('Error al procesar los datos del país');
                            }
                        }
                    } else {
                        showError('Error al cargar datos');
                    }
                })
                .catch(error => {
                    console.error('Error al cargar el archivo:', error);
                    showError('Error al cargar los datos del país: ' + error.message);
                });
        }
        
        function displayCountry(feature) {
            const props = feature.properties;
            console.log("Mostrando país:", props.COUNTRY);
            
            // Obtener lista de centrales
            const centrales = [
                {num: 1, name: props.CENTRAL1},
                {num: 2, name: props.CENTRAL2},
                {num: 3, name: props.CENTRAL3},
                {num: 4, name: props.CENTRAL4},
                {num: 5, name: props.CENTRAL5},
                {num: 6, name: props.CENTRAL6},
                {num: 7, name: props.CENTRAL7}
            ].filter(central => central.name && central.name.trim() !== '');
            
            // Contar centrales
            const centralesCount = centrales.length;
            
            // Determinar color de la zona
            let zoneColor = '#1779ba';
            
            // Generar HTML para las centrales
            let centralesHTML = '';
            if (centrales.length > 0) {
                centrales.forEach(central => {
                    centralesHTML += `
                        <div class="cell medium-6 large-4">
                            <div class="callout">
                                <span class="label">${central.num}</span>
                                <h5>${central.name}</h5>
                            </div>
                        </div>
                    `;
                });
            } else {
                centralesHTML = `
                    <div class="cell">
                        <div class="callout warning text-center">
                            <i class="fas fa-users fa-2x" style="margin-bottom: 1rem;"></i>
                            <h4>No se registran centrales sindicales</h4>
                        </div>
                    </div>
                `;
            }
            
            // Procesar la descripción HTML (si existe)
            let descripcionHTML = props.DESCRIPCION || '<p class="text-muted"><em>No hay descripción disponible</em></p>';
            
            // Crear HTML del país
            const countryHTML = `
                <div class="callout">
                    <div class="grid-x grid-padding-x align-middle margin-bottom-2">
                        <div class="cell medium-8">
                            <h2 class="h4">${props.COUNTRY || 'País sin nombre'}</h2>
                            <span class="label">${props.ZONA || 'Sin zona'}</span>
                        </div>
                        <div class="cell medium-4 text-right">
                            <span class="badge success">
                                <i class="fas fa-users"></i> ${centralesCount} centrales sindicales
                            </span>
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-info-circle"></i> Descripción</h5>
                        <div class="callout">
                            ${descripcionHTML}
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-users"></i> Centrales Sindicales</h5>
                        <div class="grid-x grid-margin-x">
                            ${centralesHTML}
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-link"></i> Recursos Adicionales</h5>
                        <div class="grid-x grid-margin-x">
                            <div class="cell medium-4">
                                <div class="callout">
                                    <h6><i class="fas fa-file-alt"></i> Entrevistas asociadas</h6>
                                    <p>${props.ENTREVISTAS || 'No disponible'}</p>
                                </div>
                            </div>
                            <div class="cell medium-4">
                                <div class="callout">
                                    <h6><i class="fas fa-gavel"></i> Legislación asociada</h6>
                                    <p>${props.LEGISLACION || 'No disponible'}</p>
                                </div>
                            </div>
                            <div class="cell medium-4">
                                <div class="callout">
                                    <h6><i class="fas fa-info"></i> Más información</h6>
                                    <p>${props.OTROS || 'No disponible'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="margin-bottom-2">
                        <h5><i class="fas fa-external-link-alt"></i> Acciones</h5>
                        <div class="button-group">
                            ${props.URLPAIS || '<a href="paises.html" class="button"><i class="fas fa-arrow-left"></i> Volver al listado</a>'}
                            <a href="paises.html" class="button secondary">
                                <i class="fas fa-list"></i> Ver todos los países
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            // Mostrar en la página
            document.getElementById('country-container').innerHTML = countryHTML;
        }
        
        function showError(message) {
            document.getElementById('country-container').innerHTML = `
                <div class="callout alert text-center">
                    <h4><i class="fas fa-exclamation-triangle"></i> ${message}</h4>
                    <p style="margin-top: 1rem;">
                        <a href="paises.html" class="button">
                            <i class="fas fa-arrow-left"></i> Volver al listado
                        </a>
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
