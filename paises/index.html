<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Índice de países — FESplataformas</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:16px;background:#f7f7f7;color:#111}
    h1{font-size:1.25rem;margin:0 0 12px}
    ul{padding-left:18px}
    li{margin:6px 0}
    a{color:#0077cc;text-decoration:none}
    .note{margin-bottom:12px;color:#444}
    .missing{color:#a00}
  </style>
</head>
<body>
  <h1>Índice de países — FESplataformas</h1>
  <div class="note">Lista dinámica de países detectados en <code>data/FESplataformas_0.js</code>. Haz clic en un país para abrir el visor.</div>
  <div id="content">Cargando…</div>

  <script src="../data/FESplataformas_0.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const content=document.getElementById('content');
      if (typeof json_FESplataformas_0 === 'undefined') { content.innerHTML = '<p class="missing">No se encontró json_FESplataformas_0</p>'; return; }
      const features = Array.isArray(json_FESplataformas_0.features) ? json_FESplataformas_0.features : [];
      const set = new Set();
      features.forEach(f=>{ const c = f && f.properties && f.properties.COUNTRY; if (typeof c === 'string' && c.trim()) set.add(c.trim()); });
      const countries = Array.from(set).sort((a,b)=> a.localeCompare(b,'es'));
      if (!countries.length) { content.innerHTML = '<p>No se encontraron países</p>'; return; }
      const ul = document.createElement('ul');
      countries.forEach(c=>{
        const li=document.createElement('li');
        const a=document.createElement('a');
        a.href = 'viewer.html?country=' + encodeURIComponent(c);
        a.textContent = c + ' \u2192 ver';
        li.appendChild(a); ul.appendChild(li);
      });
      content.innerHTML=''; content.appendChild(ul);
    });
  </script>
</body>
</html>
